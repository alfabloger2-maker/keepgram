services:
  - type: keyvalue
    name: keepgram-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

  - type: web
    name: keepgram
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEBHOOK_DROP_PENDING_UPDATES
        value: "false"
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keepgram-queue
          property: connectionString
      - key: MAX_FILES_PER_USER
        value: "5000"
      - key: MAX_TOTAL_SIZE_MB
        value: "51200"
      - key: ADMIN_TELEGRAM_IDS
        sync: false
